services:
  postgres:
    image: postgres:15-alpine
    container_name: veriship-postgres
    environment:
      POSTGRES_USER: veriship_user
      POSTGRES_PASSWORD: veriship_dev_password
      POSTGRES_DB: veriship_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U veriship_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veriship-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veriship-app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://veriship_user:veriship_dev_password@postgres:5432/veriship_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: python backend/run.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: veriship-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: veriship-mcp
    ports:
      - "8001:8001"
    environment:
      BACKEND_URL: http://veriship-app:8000
      MCP_TRANSPORT: sse
      VERISHIP_MCP_PORT: "8001"
    depends_on:
      - backend

volumes:
  postgres_data:
