services:
  postgres:
    image: postgres:16-alpine
    container_name: veriship-postgres
    environment:
      POSTGRES_USER: veriship_user
      POSTGRES_PASSWORD: veriship_dev_password
      POSTGRES_DB: veriship_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U veriship_user -d veriship_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veriship-network

  redis:
    image: redis:7-alpine
    container_name: veriship-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veriship-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veriship-app
    ports:
      - "8000:8000"
      - "8082:8080"
    environment:
      DATABASE_URL: postgresql://veriship_user:veriship_dev_password@postgres:5432/veriship_db
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:8082"]'
      VITE_API_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - veriship-network
    command: /app/start.sh

volumes:
  postgres_data:


networks:
  veriship-network:
    driver: bridge
