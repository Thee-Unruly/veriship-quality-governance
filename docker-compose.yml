services:
  postgres:
    image: postgres:16-alpine
    container_name: veriship-postgres
    environment:
      POSTGRES_USER: veriship_user
      POSTGRES_PASSWORD: veriship_dev_password
      POSTGRES_DB: veriship_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U veriship_user -d veriship_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veriship-network

  redis:
    image: redis:7-alpine
    container_name: veriship-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veriship-network

volumes:
  postgres_data:


networks:
  veriship-network:
    driver: bridge
